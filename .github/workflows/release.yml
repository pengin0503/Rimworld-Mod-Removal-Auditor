name: release

# Publishes a GitHub release from the committed mod folder. The mod assembly is built locally
# against RimWorld 1.7 and committed (the game assemblies cannot be on a public runner), so this
# workflow only verifies, tests and packages; it never builds or downloads game files.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (major.minor.patch, must match About.xml and the csproj)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test Tests/ModRemovalAuditor.Tests -c Release

      - name: Translation / XML check
        run: python3 tools/check_translations.py

      - name: Package (version and content checks)
        run: python3 tools/package.py "${{ inputs.version }}" dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi
          gh release create "v$VERSION" "dist/ModRemovalAuditor-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "Mod Removal Auditor $VERSION" \
            --notes-file "docs/releases/v$VERSION.md"
